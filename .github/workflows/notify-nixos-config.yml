name: notify-nixos-config

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-26.04
    steps:
      - name: trigger update-flake-lock in nixos-config
        run: |
          curl -sSf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/erics118/nixos-config/dispatches \
            -d '{"event_type":"input-updated","client_payload":{"input":"nixvim"}}'
