name: update-flake-lock

on:
  schedule:
    - cron: "22 14 * * 1" # mondays 10:22 edt
  workflow_dispatch:

concurrency:
  group: update-flake-lock
  cancel-in-progress: true

jobs:
  update-lock:
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      # use a bot to trigger the pr
      - uses: actions/create-github-app-token@v3
        id: app-token
        with:
          client-id: ${{ secrets.CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: DeterminateSystems/update-flake-lock@v28
        id: update
        with:
          token: ${{ steps.app-token.outputs.token }}
          # squash-merge titles the commit from the single commit-msg, not pr-title
          commit-msg: update all inputs
          pr-title: update all inputs
          pr-labels: dependencies
          branch: update_flake_lock_all
          # the id+slug form is what links the commit to the bot's profile
          git-author-name: erics118-bot[bot]
          git-author-email: 311185523+erics118-bot[bot]@users.noreply.github.com
          git-committer-name: erics118-bot[bot]
          git-committer-email: 311185523+erics118-bot[bot]@users.noreply.github.com

      # merge once the checks the branch ruleset requires pass
      - if: steps.update.outputs.pull-request-number != ''
        run: gh pr merge --auto --squash "$PR"
        env:
          PR: ${{ steps.update.outputs.pull-request-number }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
