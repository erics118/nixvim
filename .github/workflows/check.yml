name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# only the latest run per ref needs to finish
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  flake-check:
    # the branch ruleset requires these check names (`flake-check (ubuntu-26.04)` etc)
    # renaming a runner here without updating the ruleset hangs auto-merge
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - macos-26
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            extra-substituters = https://nix-community.cachix.org
            extra-trusted-public-keys = nix-community.cachix.org-1:mB9FSh9qf2dCimDSUo8Zy7bkq5CX+/rkCWyvRCYg3Fs=

      - run: nix flake check --print-build-logs
